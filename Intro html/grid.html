<!doctype html>
<html>
    <head>
        <title>Grid Practice</title>
    </head>
    <body>
        <div style="display: grid; grid-template-columns: 200px 200px; margin-bottom: 20px">
            <div style="background-color: lightblue">div1</div>
            <div style="background-color: lightpink">div2</div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr 2fr">
            <div style="background-color: lightblue">div1</div>
            <div style="background-color: lightpink">div2</div>
            <div style="background-color: lightgreen">div3</div>
        </div>
    </body>
</html>
